---
- name: VRRP interface configuration for DSW2
  hosts: DSW2
  gather_facts: false
  tasks:
    - name: VRRP configs for vrrp 20 group
      cisco.ios.ios_config:
        lines: [vrrp 10 ip 10.10.1.1, vrrp 10 priority 90]
        parents: interface Ethernet0/0.10
    - name: VRRP configs for vrrp 20 group
      cisco.ios.ios_config:
        lines:
          - vrrp 20 ip 10.20.1.1
          - vrrp 20 priority 254
          - vrrp 20 track 20 decrement 200
        parents: interface Ethernet0/0.20
