---
- name: Show vrrp configs
  hosts: DSW2
  gather_facts: false
  tasks:
    - name: Run show vrrp
      cisco.ios.ios_command:
        commands:
          - command: show vrrp
      register: output
    - name: show vrrp
      debug:
        msg: '{{ output.stdout_lines[0] }}'
    - name: Time to check configs
      pause:
        seconds: 20
