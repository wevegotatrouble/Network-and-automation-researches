---
- name: HSRP interface configuration for DSW1
  hosts: DSW1
  gather_facts: false
  tasks:
    - name: HSRP configs for standby 10 group
      cisco.ios.ios_config:
        lines:
          - standby 10 ip 10.10.1.1
          - standby 10 priority 110
          - standby 10 preempt
          - standby 10 timers 1 3
          - standby 10 track 10 decrement 50
          - standby version 1
        parents: interface Ethernet0/0.10
    - name: HSRP configs for standby 20 group
      cisco.ios.ios_config:
        lines:
          - standby 20 ip 10.20.1.1
          - standby 20 priority 90
          - standby 20 preempt
          - standby 20 timers 2 6
          - standby version 2
        parents: interface Ethernet0/0.20
