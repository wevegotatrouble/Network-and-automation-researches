---
ospf_processes:
  - process_id: 1
    reference_bandwidth: 1000000
    router_id: 4.4.4.4
    networks:
      - address: 10.1.3.4
        area: '0'
        wildcard_bits: 0.0.0.0
      - address: 10.1.1.4
        area: '0'
        wildcard_bits: 0.0.0.0
      - address: 10.1.4.4
        area: '0'
        wildcard_bits: 0.0.0.0
ospf_interfaces:
  - name: Loopback0
  - name: Ethernet0/0
  - name: Ethernet0/1
  - name: Ethernet0/2
    network_type: point-to-point
  - name: Ethernet0/3
    hello_interval: 1
    dead_interval: 4
