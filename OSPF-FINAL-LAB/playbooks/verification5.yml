---
- name: Show ospf neighbors
  hosts: R3,R4
  gather_facts: false
  tasks:
    - name: Run show ip ospf neighbor command on R3 and R4
      cisco.ios.ios_command:
        commands:
          - command: show ip ospf neighbor
      register: output
    - name: The show ip ospf neighbor command on R3/R4 must show that no DR/BDR
        exists on networks 10.1.2.0/24 and 10.1.3.0/24.
      debug:
        var: output
    - name: Time to check a verification
      pause:
        seconds: 10
